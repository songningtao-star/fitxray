# 个人资料。这些字段不参与"变化"的判定，只用于：
#   1. 记住设备 ID（跨设备的数据会被直接判为不可比）
#   2. 报告里标明这份结论是哪个设备测出来的
#
# 注意：**这里不填姓名、不填任何能定位到个人的信息**。
# 体成分是健康数据，仓库里不该出现真人数据。
# 下面这些值对应 data/sample.csv 那段合成序列。

sex: male
age: 30
height_cm: 175

# 关键字段：不同设备的数据不能相减。
# BIA 的回归公式是按设备定制的，换一台秤就换了一套坐标系。
device_id: "mi-scale-2"
device_note: "小米/华为/云麦类足部秤（单频 50kHz，只有下半身电流）"
