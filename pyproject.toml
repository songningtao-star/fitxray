[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fitxray"
version = "0.1.0"
description = "体成分变化归因 —— 在相信一个身体变化之前，先确认这个信号是不是真的"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "宋宁涛", email = "snt112358@163.com" }]
keywords = ["body-composition", "bia", "uncertainty", "measurement-error", "health-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# 只有两个依赖。装得快、跑得快 —— 这是刻意保持的：
# 一个讲"别相信数字"的工具，自己就不该拖进来一堆数字。
dependencies = [
    "numpy>=1.20",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fitxray = "fitxray.cli:main"

[project.urls]
Homepage = "https://github.com/songningtao-star/fitxray"

[tool.setuptools]
packages = ["fitxray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
